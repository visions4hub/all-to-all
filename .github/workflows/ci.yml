# Checks every push and pull request. On a push to main, once every check has
# passed, the same build is published to Cloudflare Pages (see docs/DEPLOY.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      # The exact files that were tested are the ones that get published.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time; a newer push waits instead of racing.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare isn't configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable is missing; not deploying."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        name: Publish to Cloudflare Pages
        # Only the commit hash is passed (never the commit message, which could inject shell code).
        # A token pasted into the GitHub form can pick up a stray line break or a second line;
        # Cloudflare tokens are one word, so keep the first non-empty word and report its shape.
        run: |
          lines=$(printf '%s\n' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | grep -c '[^[:space:]]' || true)
          token=$(printf '%s\n' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | awk 'NF { print $1; exit }')
          echo "Token secret: ${lines} non-empty line(s); using a ${#token}-character token."
          if [ "$lines" -gt 1 ]; then echo "::warning::CLOUDFLARE_API_TOKEN has ${lines} lines; only the first is used. Re-save the secret with just the token."; fi
          CLOUDFLARE_API_TOKEN="$token" npx --yes wrangler@4.157.0 pages deploy out --project-name all-to-all --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
